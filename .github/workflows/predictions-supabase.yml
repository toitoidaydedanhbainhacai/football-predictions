name: World Cup Predictions to Supabase

# NOTE: GitHub Actions only runs workflow files that end in .yml / .yaml.
# Your existing files (daily-predictions, save_data, validate_main, ...) have NO
# extension, so GitHub silently ignores them. This file is correctly named.

on:
  schedule:
    # Every 6 hours (knockout matches are spread across the day during the WC)
    - cron: '0 */6 * * *'
  workflow_dispatch:        # manual "Run workflow" button

jobs:
  predict-and-store:
    runs-on: ubuntu-latest
    env:
      FOOTYSTATSAPI: ${{ secrets.FOOTYSTATSAPI }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage 1 - fetch today's fixtures
        run: python today_matches.py

      - name: Stage 2 - build features
        run: python fetch_data.py

      - name: Stage 3 - predict
        run: python predicting.py

      - name: Stage 4 - store predictions in Supabase
        run: python save_to_supabase.py

      - name: Stage 5 - settle finished matches (accuracy)
        run: python validate_to_supabase.py

      - name: Upload CSV backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_number }}
          path: |
            live.csv
            extracted_features_complete.csv
            best_match_predictions.csv
          retention-days: 14
